<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Flowstate">
  <!-- Flowstate mark: a sharp striker's "ego eye" entering flow, football-panel iris, lightning flow trail, hexagon badge. -->
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163a96"/>
      <stop offset="0.6" stop-color="#050d2a"/>
      <stop offset="1" stop-color="#02040b"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#9ff9ff"/>
      <stop offset="0.4" stop-color="#19e6ff"/>
      <stop offset="1" stop-color="#1f4fe0"/>
    </radialGradient>
    <clipPath id="eye">
      <path d="M9 35 L22 24 L44 19.5 L57 27 L45 39.5 L24 42 Z"/>
    </clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <polygon points="32,2 59,17 59,47 32,62 5,47 5,17" fill="url(#badge)" stroke="#19e6ff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- eye: sclera, then iris clipped by the angular lids -->
  <path d="M9 35 L22 24 L44 19.5 L57 27 L45 39.5 L24 42 Z" fill="#e8f6ff"/>
  <g clip-path="url(#eye)">
    <circle cx="34" cy="31" r="9.5" fill="url(#iris)"/>
    <polygon points="34,27.2 37.61,29.83 36.23,34.07 31.77,34.07 30.39,29.83" fill="#02040b"/>
    <path d="M34 27.2 L34 22 M37.61 29.83 L42.56 28.22 M36.23 34.07 L39.29 38.28 M31.77 34.07 L28.71 38.28 M30.39 29.83 L25.44 28.22"
          stroke="#02040b" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="38.2" cy="26.6" r="1.8" fill="#ffffff"/>
  </g>

  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- heavy upper lid -->
    <path d="M7 36.5 L22 23.5 L44 18.5 L57.5 26.5" stroke="#19e6ff" stroke-width="3.4"/>
    <!-- lightning flow trail from the outer corner -->
    <path d="M57.5 26.5 L50.5 34.5 L56 35.5 L49 45" stroke="#19e6ff" stroke-width="2.4"/>
    <!-- lower lid -->
    <path d="M14 40 L24 42.6 L45 39.8" stroke="#3b7bff" stroke-width="1.6"/>
  </g>
</svg>
